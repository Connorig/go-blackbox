name: Go Module Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.20.x"
          cache: true

      - name: Verify module path
        run: test "$(go list -m)" = "github.com/Connorig/go-blackbox"

      - name: Compile all packages without running integration tests
        run: go test ./... -run '^$'

      - name: Run isolated lifecycle tests
        run: go test ./framework/lifecycle . && go test ./framework/web -run 'TestNew|TestInit|TestRunRejects|TestStaticSource'

      - name: Run vet
        run: go vet ./...

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
