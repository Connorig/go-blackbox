name: Go Module Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.21.x"
          cache: true

      - name: Verify module path
        run: test "$(go list -m)" = "github.com/Connorig/go-blackbox"

      - name: Verify banner version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CONST_VERSION=$(grep -oP 'const Version = "\K[^"]+' banner.go)
          if [ "$TAG_VERSION" != "$CONST_VERSION" ]; then
            echo "::error::version mismatch: tag=v${TAG_VERSION} banner=${CONST_VERSION}"
            exit 1
          fi
          echo "version check OK: v${TAG_VERSION}"

      - name: Verify changelog entry exists
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## v${TAG_VERSION}" CHANGELOG.md; then
            echo "::error::CHANGELOG.md missing entry for v${TAG_VERSION}. Add release notes first."
            exit 1
          fi
          echo "changelog entry OK: v${TAG_VERSION}"

      - name: Extract changelog section as release notes
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="v${TAG_VERSION}" '
            BEGIN { found=0 }
            /^## / {
              if (found) exit
              if ($2 == ver) found=1
            }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::failed to extract release notes for v${TAG_VERSION}"
            exit 1
          fi
          echo "--- release notes ---"
          cat /tmp/release-notes.md

      - name: Compile all packages without running integration tests
        run: go test ./... -run '^$'

      - name: Run isolated lifecycle tests
        run: go test ./framework/lifecycle . && go test ./framework/web -run 'TestNew|TestInit|TestRunRejects|TestStaticSource'

      - name: Run vet
        run: go vet ./...

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: /tmp/release-notes.md
